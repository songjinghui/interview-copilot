<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>求职助手 · 交互设计原型</title>
<style>
:root{--ink:#23334a;--blue:#2856a3;--bg:#f2f5f9;--green:#286550;--brown:#805a16;--line:#d7dfeb}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.65 "Microsoft YaHei UI","PingFang SC",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue)}button{padding:8px 16px;border:1px solid var(--line);border-radius:5px;background:white;color:var(--ink);cursor:pointer}button:hover{border-color:var(--blue)}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button:disabled{opacity:.55;cursor:not-allowed}a{color:var(--blue)}.shell{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:100vh}.sidebar{padding:28px 16px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}.brand{font-size:20px;font-weight:700;padding:0 12px 26px}.sidebar a{padding:10px 12px;border-radius:5px;color:var(--ink);text-decoration:none}.sidebar a.active{background:#e8eef9;color:var(--blue);font-weight:700}.sidebar small{margin-top:auto;padding:28px 12px 0;color:#53637a}.main{padding:26px 32px;min-width:0}.demo{font-size:13px;padding:10px 14px;border:1px dashed #a9b8ce;border-radius:5px;margin-bottom:24px;display:flex;justify-content:space-between;gap:16px;align-items:center}.demo button{padding:2px 10px;font-size:13px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}h1{font-size:26px;line-height:1.35;margin:0 0 6px}h2{font-size:19px;margin:0 0 16px}h3{font-size:16px;margin:22px 0 8px}p{margin:8px 0 16px}.muted,small{color:#53637a}small{font-size:13px}.split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px}.panel{padding:24px;background:white;border:1px solid var(--line);border-radius:8px}.context{border-top:4px solid var(--blue)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:16px}.job{width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--line);padding:20px}.job.selected{background:#edf2fc;border-left:3px solid var(--blue);padding-left:17px}.job strong{display:block;font-size:16px}.job small{display:block;margin:6px 0}.list{padding:0;overflow:hidden}.tag{display:inline-block;border-radius:4px;font-size:12px;padding:2px 7px;background:#edf2fc;color:var(--blue)}.tag.warn{background:#fbf2dc;color:var(--brown)}.tag.good{background:#e9f3ed;color:var(--green)}.notice{border-left:3px solid var(--brown);background:#fff9ed;padding:14px 18px;margin:18px 0}.notice.good{border-color:var(--green);background:#f0f7f3}.measure{max-width:760px}.measure p,.measure li{max-width:46em}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:22px}label{display:grid;gap:6px;font-size:13px;font-weight:600;flex:1;min-width:140px}input,select,textarea{width:100%;border:1px solid #acbace;border-radius:5px;padding:8px 10px;background:#fff;color:var(--ink);font-weight:400}textarea{min-height:100px}.rule{border:0;border-top:1px solid var(--line);margin:22px 0}.kv{display:grid;grid-template-columns:96px 1fr;gap:12px;margin:18px 0}.kv dt{color:#53637a}.kv dd{margin:0}.step{font-size:13px;color:#53637a;margin-bottom:16px}.big-number{font-size:28px;font-weight:600;color:var(--blue)}.timeline{border-left:2px solid var(--line);margin:20px 8px;padding-left:22px}.timeline section{padding:0 0 22px}.timeline h3{margin-top:0}.task{padding:18px 0;border-bottom:1px solid var(--line)}progress{width:100%;height:7px;accent-color:var(--blue)}.segments button{font-size:13px;padding:4px 10px}.segments p{padding:12px 0;border-bottom:1px solid var(--line)}.actionbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.empty{padding:48px 20px;text-align:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.check{display:flex;align-items:start;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}.check input{width:20px;height:20px;flex-shrink:0}.check label{display:block;font-size:15px}.check small{display:block;font-weight:400}.check.done strong{text-decoration:line-through;color:#53637a}dialog{border:1px solid var(--line);border-radius:8px;padding:28px;width:560px;max-width:calc(100vw - 30px);color:var(--ink)}dialog::backdrop{background:rgba(35,51,74,.3)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 20px;border-radius:5px;max-width:80%;z-index:10;display:none}#toast.visible{display:block}.save{font-size:13px;color:var(--green)}.linklike{border:0;padding:0;background:none;color:var(--blue);text-decoration:underline}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:1100px){.main{padding:20px}.split{grid-template-columns:280px minmax(0,1fr)}.shell{grid-template-columns:150px minmax(0,1fr)}}
@media(max-width:850px){.shell{display:block}.sidebar{padding:12px;flex-direction:row;overflow:auto}.sidebar a{white-space:nowrap}.brand{font-size:16px;padding:8px}.sidebar small{display:none}.main{padding:18px}.split,.grid2{grid-template-columns:1fr}.demo{align-items:start}header{align-items:start}.panel{padding:20px}.kv{grid-template-columns:80px 1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<div class="shell"><nav class="sidebar" aria-label="主导航"><div class="brand">求职助手</div><a href="#home">工作台</a><a href="#jobs">找岗位</a><a href="#opportunities">我的机会</a><a href="#interviews">面试</a><a href="#improvements">改进清单</a><a href="#profile">我的资料</a><a href="#settings">设置</a><small>资料保存在本机<br>设计稿 v0.3</small></nav><main class="main"><div class="demo"><span>交互原型 · 全部资料为虚构样例 · 操作不会保存或对外发送</span><button data-act="reset">重置演示</button></div><div id="view"></div></main></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="newInterview"><form id="interviewForm"><h2>补录已有面试</h2><p class="muted">可以直接记录，无需补做找岗或投递步骤。</p><div class="stack"><label>岗位名称<input name="title" value="AI 应用工程师" required></label><label>公司<input name="company" value="远山科技（虚构）" required></label><label>面试名称<input name="label" value="第一轮技术面试" required></label><label>面试日期（未知可留空）<input name="date" type="date"></label><p class="muted">JD、当次简历和面试内容可在记录后补齐。</p></div><div class="actionbar"><button class="primary" type="submit">保存面试记录</button><button type="button" data-act="close-dialog">取消</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({cooldown:'present',step:0,resume:'v2',exception:'',application:null,report:false,reportInputs:null,added:false,done:false,interview:null,task:'running',generation:1,review:{title:'',jd:'v2',resume:'v2',text:'combined'}});
let state=initial(),timer; const title='AI 应用工程师', company='远山科技（虚构）';
const nav=v=>{location.hash=v;render()}; const toast=t=>{$('#toast').textContent=t;$('#toast').classList.add('visible');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('visible'),5000)};
const head=(t,s,action='')=>`<header><div><h1>${t}</h1><div class="muted">${s}</div></div><div class="row">${action}<button data-nav="tasks">后台任务 <span class="tag">1</span></button></div></header>`;
const jobtext=`<h3>岗位职责</h3><ol><li>将真实业务问题转化为可评估的 AI 应用，参与检索与问答服务开发。</li><li>建立回答质量和运行性能的评估，持续定位失败样本。</li><li>与产品同事协作，解释技术取舍并推进上线。</li></ol><h3>任职要求</h3><p>熟悉 Python 与服务开发；有检索或大模型应用实践。能够清楚说明个人职责、项目取舍和结果依据。</p>`;
function jobs(){return head('找岗位','从你的目标出发，保存每一份可追溯的 JD。')+`<div class="toolbar"><label>岗位关键词<input value="AI 应用开发"></label><label>城市<select><option>上海</option><option>不限</option></select></label><button class="primary" data-act="search">查找岗位</button><button data-act="import-job">导入岗位</button></div><div class="split"><section class="panel list"><div style="padding:16px 20px"><b>3 个候选</b><br><small>示例来源 · 详情更新时间 11 月 4 日</small></div><button class="job selected" data-act="selected"><strong>${title}</strong><small>${company} · 上海 · 薪资未披露</small><span class="tag good">JD 完整</span> <span class="tag warn">有冷却期说明</span></button><button class="job" data-act="partial"><strong>平台研发工程师</strong><small>山海工作室（虚构） · 上海</small><span class="tag">详情待补齐</span></button><button class="job" data-act="unknown"><strong>产品研发工程师</strong><small>南河科技（虚构） · 地点待核实</small><span class="tag">硬条件待核实</span></button></section><article class="panel context measure"><div class="row between"><span class="tag good">完整 JD · 修订 2</span><button class="linklike" data-act="original">查看原始来源</button></div><h2 style="margin-top:18px">${title}</h2><p class="muted">${company} · 上海<br><small>完整 JD 获取于 2026-11-04 14:10</small></p>${jobtext}<div class="notice"><b>冷却期：有适用说明</b><br>招聘方说明再次申请需等待，具体期限待核实。<br><small>依据：用户补录的招聘方说明（虚构）</small></div><div class="actionbar"><button class="primary" data-nav="prepare">加入机会并准备投递</button><button data-act="match">查看匹配依据</button></div></article></div>`}
function prepare(){let notice=state.cooldown==='present'?'<b>有适用冷却期</b><br>招聘方说明再次申请需等待，期限尚未明确。<br><small>依据：用户补录招聘方说明（虚构）；核验于 11 月 4 日</small>':state.cooldown==='unknown'?'<b>冷却期待核实</b><br>尚未查到足够依据，请自行核对后决定是否投递。':'<b>无适用冷却期（有依据）</b><br>此演示场景依据为招聘方明确说明，不是“没查到就算没有”。';let actions=state.step===0?'<button class="primary" data-act="confirm-materials">确认岗位与材料</button>':state.step===1?'<button class="primary" data-act="confirm-cooldown">知道了，继续去投递</button><button data-act="defer">暂不投递</button>':'<button class="primary" data-act="open-apply">打开投递页面</button><button data-nav="record">补记投递结果</button>';return head('准备投递','核对这一次使用的岗位与材料。', '<button data-nav="opportunities">返回机会</button>')+`<div class="split"><aside class="panel"><h2>本次机会</h2><b>${title}</b><p class="muted">${company}</p><dl class="kv"><dt>岗位材料</dt><dd>完整 JD · 修订 2</dd><dt>渠道</dt><dd>公司招聘官网</dd><dt>当前进度</dt><dd>${state.application==='submitted'?'已补记提交':state.step===2?'材料已准备好':'尚未提交'}</dd></dl><hr class="rule"><label>演示冷却期场景<select id="cooldown"><option value="present" ${state.cooldown==='present'?'selected':''}>有适用冷却期</option><option value="absent" ${state.cooldown==='absent'?'selected':''}>无（有依据）</option><option value="unknown" ${state.cooldown==='unknown'?'selected':''}>待核实</option></select></label><p><small>切换场景会重置确认，用于审查一/两次确认的分支。</small></p></aside><section class="panel context"><div class="step">${state.step===0?'第 1 步 · 岗位与材料':state.step===1?'第 2 步 · 确认冷却期':'已准备好 · 由你手动投递'}</div><h2>${state.step===1?'核对冷却期说明':state.step===2?'可以前往原渠道投递':'确认本次使用的材料'}</h2><label>当次简历<select id="prepResume"><option value="v2" ${state.resume==='v2'?'selected':''}>AI 应用方向简历 · v2</option><option value="v1" ${state.resume==='v1'?'selected':''}>通用简历 · v1</option><option value="none" ${state.resume==='none'?'selected':''}>此渠道无需简历</option></select></label>${state.resume==='none'?`<label style="margin-top:16px">无需简历的说明<input id="exception" value="${esc(state.exception)}" placeholder="例如：本次只需填写在线资料"></label>`:''}<div class="notice ${state.cooldown==='absent'?'good':''}">${notice}</div>${state.step===2?'<p>打开网页仅表示去投递。实际提交后，请回来补记结果。</p>':'<p class="muted">更换岗位、材料或说明后，需要重新核对本次准备。</p>'}<div class="actionbar">${actions}</div><div id="prepError" role="alert"></div></section></div>`}
function record(){return head('补记投递结果','记录已经发生的事实；这不是投递前的额外授权。')+`<section class="panel measure"><h2>${title}</h2><form id="recordForm" class="stack"><label>实际结果<select name="outcome"><option value="submitted">已提交</option><option value="unknown">结果待确认</option><option value="failed">未成功</option></select></label><label>实际提交时间<input name="time" type="datetime-local" value="2026-11-04T14:30" required></label><label>渠道<input value="公司招聘官网" required></label><label>使用的简历<input value="${state.resume==='none'?'无需简历：'+esc(state.exception):'AI 应用方向简历 · '+esc(state.resume)}" required></label><label>依据或补充说明<textarea name="evidence" required>我已在原渠道完成提交（演示）。</textarea></label><div><button class="primary">保存结果</button> <button type="button" data-nav="opportunities">取消</button></div></form></section>`}
function opportunities(){return head('我的机会','岗位、投递与每轮面试，放在同一段经历里。','<button data-act="new-interview">补录已有面试</button>')+`<div class="split"><section class="panel list"><button class="job selected" data-nav="prepare"><strong>${title}</strong><small>${company}</small><span class="tag">${state.application==='submitted'?'已投递':state.application==='unknown'?'结果待确认':'准备中'}</span></button></section><section class="panel context"><h2>${title}</h2><div class="row"><button class="primary" data-nav="prepare">准备投递</button><button data-nav="record">补记历史投递</button><button data-act="new-interview">添加面试</button></div><div class="timeline"><section><h3>最近进展</h3><p>${state.application==='submitted'?'你补记了实际提交结果；当次材料已固定。':state.application==='unknown'?'已记录结果待确认，没有记为成功。':'机会已保存，尚未记录实际提交。'}</p></section><section><h3>岗位与材料</h3><p>JD 修订 2 · 简历 ${esc(state.resume)}</p><button class="linklike" data-nav="jobs">查看岗位原文与依据</button></section><section><h3>面试与复盘</h3><p>${state.interview?'已补录 '+esc(state.interview.label):'可直接补录已有面试，无需创建投递记录。'}</p><button data-nav="interview">查看面试示例</button></section></div></section></div>`}
function interviews(){return head('面试','安排下一轮，也可以从一场已结束的面试开始。','<button class="primary" data-act="new-interview">补录已有面试</button>')+`<section class="panel"><div class="row between"><div><h2>${state.interview?esc(state.interview.label):'第一轮技术面试'}</h2><p>${state.interview?esc(state.interview.title):title} · ${state.interview?esc(state.interview.company):company}</p><small>${state.interview?.date?esc(state.interview.date):'时间未知 · 可以后补'} · 时区 Asia/Shanghai</small></div><button class="primary" data-nav="interview">打开面试记录</button></div></section>`}
function interview(){return head(state.interview?esc(state.interview.label):'第一轮技术面试','准备材料、校对文字，再生成有依据的复盘。','<button data-nav="interviews">面试列表</button>')+`<div class="grid2"><section class="panel context"><h2>本场复盘的四项材料</h2><div class="stack"><label>岗位名称<input id="reviewTitle" value="${esc(state.review.title||state.interview?.title||title)}"></label><label>JD 版本<select id="reviewJd"><option value="v2" ${state.review.jd==='v2'?'selected':''}>完整 JD · 修订 2</option><option value="missing" ${state.review.jd==='missing'?'selected':''}>暂缺 JD</option></select></label><label>当次简历<select id="reviewResume"><option value="v2" ${state.review.resume==='v2'?'selected':''}>AI 应用方向 · v2</option><option value="missing" ${state.review.resume==='missing'?'selected':''}>暂缺简历</option></select></label><label>面试内容<select id="reviewText"><option value="combined" ${state.review.text==='combined'?'selected':''}>录音 A + B 的组合文字 · v3</option><option value="manual" ${state.review.text==='manual'?'selected':''}>手工回忆 · v4</option><option value="missing" ${state.review.text==='missing'?'selected':''}>尚未填写</option></select></label></div><p id="inputLimit" class="muted">${state.review.jd==='missing'||state.review.resume==='missing'?'资料不完整，报告将明确说明分析局限。':'报告固定使用当前选择的材料版本。'}</p><p><small>文字分析将按设置发送这四项文字；音频留在本机。此原型不调用模型。</small></p><button class="primary" data-act="review" ${state.review.text==='missing'?'disabled':''}>生成复盘（演示）</button></section><section class="panel"><h2>面试内容</h2><div class="row"><button data-act="import-audio">导入音频（演示）</button><button data-act="recording">录音设备检查</button></div><p class="save">录音已保存 · 转写在后台进行</p><div class="segments"><h3>组合文字示例</h3><p><button data-act="play-a">录音 A · 00:30</button><br>面试官：你在检索项目里具体负责什么？</p><p><button data-act="play-b">录音 B · 00:30</button><br>候选人：团队做了评估，但我还需要更清楚地说明自己的判断和行动。</p></div><small>相同时间码分别定位各自的音频，不把两段拼成虚构时间轴。</small><div class="actionbar"><button data-act="correct">校对并保存新版本</button><button data-act="rerun">重新转写</button></div></section></div>`}
function report(){const inputs=state.reportInputs||{...state.review,title};return head('面试复盘','演示报告 · 内容为预置样例，没有执行模型分析。')+`<div class="split"><aside class="panel"><h2>本次输入</h2><dl class="kv"><dt>岗位</dt><dd>${esc(inputs.title||title)}</dd><dt>JD</dt><dd>${inputs.jd==='missing'?'暂缺':esc(inputs.jd)}</dd><dt>简历</dt><dd>${inputs.resume==='missing'?'暂缺':esc(inputs.resume)}</dd><dt>面试内容</dt><dd>${inputs.text==='manual'?'手工回忆 v4':'组合文字 v3'}</dd></dl><button data-nav="interview">核对或更换材料</button></aside><article class="panel context measure">${state.reportInputs&&JSON.stringify({...state.review,title:state.review.title||state.interview?.title||title})!==JSON.stringify(inputs)?'<p class="notice">材料选择已改变，本报告仍使用生成时的版本。</p>':''}<h2>把“团队结果”补充为“个人行动”</h2><p>这次回答提到了团队完成的评估，但没有明确说明你负责的决策、行动及结果依据。</p><div class="notice">这是对本次回答证据的分析，不能据此判断你不具备相应能力。</div><h3>原话依据</h3><p>“团队做了评估，但我还需要更清楚地说明自己的判断和行动。”</p>${inputs.text==='manual'?'<p class="muted">依据：手工回忆 v4 · 第 2 段（没有音频时间点）</p>':'<button class="linklike" data-act="play-b">回看组合文字 v3 · 录音 B 00:30</button>'}<h3>可执行的下一步</h3><p>选一个真实项目，整理个人职责、一次关键取舍及可核对的结果；缺少的数字标注待补充。</p><button class="primary" data-act="add-improvement">${state.added?'已加入改进清单':'加入改进清单'}</button> <button data-nav="improvements">查看改进清单</button>${inputs.jd==='missing'||inputs.resume==='missing'?'<p class="notice">本次材料不完整：缺少 JD 或简历，结论范围需要保留。</p>':''}</article></div>`}
function improvements(){return head('改进清单','你决定下一步行动；重新生成报告不会覆盖这里的进度。')+`<section class="panel">${state.added?`<div class="check ${state.done?'done':''}"><input id="done" type="checkbox" ${state.done?'checked':''}><label for="done"><strong>补充项目中的个人职责与关键取舍</strong><small>整理一次真实决策及结果依据 · 高优先级</small><small>来源：第一轮技术面试复盘 · ${state.done?'已完成':'待行动'}</small></label></div><div class="actionbar"><button data-nav="report">查看来源</button><button data-act="regenerate">演示：重新生成报告</button></div>`:'<div class="empty"><h2>把值得改进的事变成下一步行动</h2><p>从报告添加建议，或在正式应用中自行记录。</p><button class="primary" data-nav="interview">打开面试记录</button></div>'}</section>`}
function tasks(){let labels={running:'正在转写',queued:'中断后正在恢复',paused:'已暂停',cancelled:'已取消',succeeded:'转写完成',needs_attention:'需要处理'};return head('后台任务','关闭页面不影响后台；这里的按钮仅模拟状态变化。')+`<section class="panel"><div class="task"><div class="row between"><div><h2>第一轮技术面试 · 本地转写</h2><small>录音 A · 处理请求 ${state.generation} · 中文模型</small></div><span class="tag ${state.task==='succeeded'?'good':''}">${labels[state.task]}</span></div>${state.task==='running'?'<progress value="35" max="100" aria-label="演示转写进度 35%"></progress>':''}<p>${state.task==='paused'?'你主动暂停了任务，服务重启也不会继续。':state.task==='succeeded'?'文字结果已保存，旧校对内容保持不变。':'音频保存在本机。发生中断时，后台会恢复同一个处理请求。'}</p><div class="row">${['running','queued'].includes(state.task)?'<button data-act="pause">暂停</button><button data-act="cancel-task">取消转写</button>':state.task==='paused'?'<button data-act="resume">继续</button>':'<button data-act="rerun">创建新的转写请求</button>'}<button data-nav="interview">查看面试</button></div></div><h3>用于审查的状态模拟</h3><div class="row"><button data-act="restart">模拟服务重启</button><button data-act="finish">模拟转写完成</button></div><p><small>这是状态原型，不验证操作系统唤醒、真实转写或文件恢复。</small></p></section>`}
function profile(){return head('我的资料','已确认的事实和每一份简历，构成后续工作的基础。')+`<div class="grid2"><section class="panel"><h2>求职目标</h2><label>关键词<input value="AI 应用开发"></label><label style="margin-top:16px">城市<input value="上海"></label><p><span class="tag">必须满足：城市</span> <span class="tag">优先考虑：检索应用</span></p><button data-act="save-profile">保存目标（演示）</button></section><section class="panel"><h2>简历与真实经历</h2><p>AI 应用方向简历 · v2<br><small>已保存版本；历史投递仍使用当时的简历。</small></p><hr class="rule"><b>项目经历（虚构样例）</b><p>检索问答服务开发与评估。</p><span class="tag good">用户已确认</span></section></div>`}
function settings(){return head('设置','按能力增加来源；本机处理与外部文字分析分别配置。')+`<div class="grid2"><section class="panel"><h2>来源能力</h2><p>候选来源是否可用，以产品接入验证为准。</p><div class="task"><b>手动导入</b><p><span class="tag good">岗位与反馈材料</span></p></div><div class="task"><b>招聘来源示例</b><p><span class="tag">岗位搜索</span> <span class="tag">读取详情</span></p><small>示意注册表渲染，不代表真实平台已接入。</small></div><p><small>增加来源需要对应适配器与配置，核心流程保持一致。</small></p></section><section class="panel"><h2>本地后台与资料</h2><p>转写默认在后台执行，音频不上传。</p><p>文字分析使用单独配置的模型服务，发起分析前展示输入范围。</p><p class="notice">此原型不会改变开机启动、麦克风权限或模型配置。</p><button data-nav="tasks">查看后台任务</button></section></div>`}
function home(){return head('工作台','从今天要推进的机会开始。')+`<div class="grid2"><section class="panel context"><h2>继续推进这次机会</h2><h3>${title}</h3><p>${company}</p><p>岗位与材料已集中在这里，可以继续准备，也可以补录已有进展。</p><div class="actionbar"><button class="primary" data-nav="opportunities">打开机会</button><button data-act="new-interview">补录面试</button></div></section><section class="panel"><h2>面试后的下一步</h2><p>核对文字、查看固定的四项材料，再形成可以落实的改进。</p><div class="actionbar"><button data-nav="interview">进入面试记录</button><button data-nav="improvements">查看改进</button></div><hr class="rule"><span class="tag">后台转写 ${state.task==='paused'?'已暂停':'处理中'}</span><p><small>正常转写无需等待在这个页面。</small></p></section></div>`}
function render(){const v=location.hash.slice(1)||'jobs',pages={home,jobs,prepare,record,opportunities,interviews,interview,report,improvements,tasks,profile,settings};$('#view').innerHTML=(pages[v]||home)();document.querySelectorAll('.sidebar a').forEach(a=>a.classList.toggle('active',a.hash==='#'+v||(v==='prepare'||v==='record')&&a.hash==='#opportunities'||(v==='interview'||v==='report')&&a.hash==='#interviews'));document.title='求职助手 · '+($('#view h1')?.textContent||'原型')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav],[data-act]');if(!b)return;if(b.dataset.nav){nav(b.dataset.nav);return}switch(b.dataset.act){case'reset':state=initial();nav('jobs');toast('演示已重置');break;case'new-interview':$('#newInterview').showModal();break;case'close-dialog':$('#newInterview').close();break;case'confirm-materials':if(state.resume==='none'&&!state.exception.trim()){$('#prepError').textContent='请填写此渠道无需简历的说明。';return}state.step=state.cooldown==='present'?1:2;render();break;case'confirm-cooldown':state.step=2;render();break;case'defer':state.step=0;nav('opportunities');toast('已暂缓，没有记录为已投递');break;case'open-apply':toast('此处在正式应用中打开原渠道；原型未打开网页，也未记录提交。');break;case'review':state.report=true;state.reportInputs={...state.review,title:state.review.title||state.interview?.title||title};nav('report');break;case'add-improvement':state.added=true;render();toast('已加入改进清单；再次点击不会重复创建');break;case'regenerate':toast('演示报告已重新生成，清单内容和完成状态保持不变。');break;case'pause':state.task='paused';render();break;case'resume':state.task='queued';render();break;case'cancel-task':state.task='cancelled';render();break;case'restart':if(state.task==='running')state.task='queued';render();toast('已模拟重启：恢复未完成任务，保留暂停/取消状态。');break;case'finish':if(['running','queued'].includes(state.task))state.task='succeeded';render();break;case'rerun':state.generation++;state.task='queued';nav('tasks');toast('新的转写请求已排队；旧文字和校对仍保留。');break;case'import-audio':state.task='queued';toast('演示：音频保存后自动排队，无需再点开始转写。');break;case'play-a':toast('引用定位：录音 A，00:30–00:40。原型不含音频。');break;case'play-b':toast('引用定位：录音 B，00:30–00:40。原型不含音频。');break;case'correct':toast('演示：保存校对版本，逐段音频来源与旧报告引用保持。');break;case'recording':toast('正式录制前将检查麦克风与系统声音；原型不申请录音权限。');break;case'search':toast('显示预置的 3 条虚构候选；没有请求真实招聘网站。');break;case'partial':toast('此候选仅有摘要：正式应用显示缺失字段和详情读取状态。');break;case'unknown':toast('地点未知会标为待核实，不直接当作符合硬条件。');break;case'match':toast('依据：JD 要求 Python 和评估实践，已确认的项目经历包含对应内容。');break;case'import-job':toast('正式应用支持粘贴岗位链接或手动填写原文。');break;case'original':toast('原型无真实原链接；正式应用显示来源和获取时间。');break;case'save-profile':toast('目标演示已确认，不会写入你的真实资料。');break;default:break}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='cooldown'){state.cooldown=el.value;state.step=0;render()}if(el.id==='prepResume'){state.resume=el.value;state.step=0;render()}if(el.id==='exception'){state.exception=el.value;state.step=0;render()}if(el.id==='done'){state.done=el.checked;render()}if(el.id==='reviewTitle'){state.review.title=el.value}if(el.id==='reviewJd'){state.review.jd=el.value;render()}if(el.id==='reviewResume'){state.review.resume=el.value;render()}if(el.id==='reviewText'){state.review.text=el.value;render()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='interviewForm'){const f=new FormData(e.target);state.interview=Object.fromEntries(f);$('#newInterview').close();nav('interview');toast('已补录示例面试，没有创建虚假的投递记录。')}if(e.target.id==='recordForm'){state.application=new FormData(e.target).get('outcome');nav('opportunities');toast('实际结果已记录（仅演示）。')}});
window.addEventListener('hashchange',render);render();
</script>
</html>
