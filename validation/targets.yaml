platforms:
  boss:
    name: BOSS 直聘
    home: https://www.zhipin.com/
    job_search: https://www.zhipin.com/web/geek/job
    sample_queries:
      - keyword: 产品经理
        city: 101010100  # 北京城市编码，仅作示例
      - keyword: 后端开发
        city: 101020100  # 上海城市编码
    application_mode: 网页端聊天/投递或 APP 端沟通
    feedback_channels: [BOSS 站内消息, 微信, 电话, 短信]
    notes: >-
      公开搜索页可见，但完整 JD、聊天、投递与个人消息需要登录。
      反爬与账号风控较强，自动化需单独验证。

  liepin:
    name: 猎聘
    home: https://www.liepin.com/
    job_search: https://www.liepin.com/zhaopin/
    sample_queries:
      - keyword: 产品经理
      - keyword: 后端开发
    application_mode: 网页端投递/沟通或 APP 端
    feedback_channels: [猎聘站内信, 微信, 电话, 邮件, 短信]
    notes: >-
      公开搜索页可见，部分 JD 需要登录查看完整内容。
      猎头沟通、投递记录与个人消息需要登录授权。

feedback_channels:
  - id: 官网申请状态
    name: 企业招聘官网申请状态页
    needs_auth: true
    automation_difficulty: 中
    reliability: 高
    note: 需要登录对应企业招聘账号，通常有申请记录、状态变更。

  - id: 邮件
    name: 电子邮箱
    needs_auth: true
    automation_difficulty: 中
    reliability: 高
    note: offer、面试邀请、拒信常见渠道，可通过授权邮箱同步或用户导入。

  - id: 短信
    name: 手机短信
    needs_auth: true
    automation_difficulty: 高
    reliability: 中
    note: 多平台、多设备，自动同步难度大，通常由用户手动补记或截图导入。

  - id: 电话
    name: 电话沟通
    needs_auth: false
    automation_difficulty: 高
    reliability: 低
    note: 无法自动读取，需用户手动记录通话要点。

  - id: 微信
    name: 微信/企业微信
    needs_auth: true
    automation_difficulty: 高
    reliability: 中
    note: 私人通讯，自动读取涉及隐私与合规，建议用户导入或补记。

  - id: BOSS 站内消息
    name: BOSS 直聘站内消息
    needs_auth: true
    automation_difficulty: 高
    reliability: 高
    note: 投递与沟通的核心反馈入口，需登录授权且受平台风控限制。

  - id: 猎聘站内信
    name: 猎聘站内信
    needs_auth: true
    automation_difficulty: 高
    reliability: 高
    note: 投递与猎头沟通的核心反馈入口，需登录授权。
