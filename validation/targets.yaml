  - name: 百度
    career_home: https://talent.baidu.com/
    job_search: https://talent.baidu.com/jobs/social/list
    keywords: ["产品经理", "后端开发", "算法工程师"]
    application_portal: https://talent.baidu.com/
    feedback_channels: [官网申请状态, 邮件, 电话]

