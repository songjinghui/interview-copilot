# 求职助手验证目标配置
# 本文件仅用于初始连通性与公开页面可解析性验证，不包含登录凭据，也不执行真实投递。
# 用户已指定首批验证阿里、腾讯、美团；其余条目保留为未验证候选。

meta:
  purpose: 验证找岗、代投与反馈回收的代表性路径
  created: "2026-11-03"
  note: >-
    首批验证样本已确认为阿里巴巴、腾讯、美团。
    其余企业是原有候选，尚未确认入口和能力；关键词及反馈渠道也仅作候选，不代表用户实际求职方向或已验证接入。

companies:
  # 互联网 / 科技
  - name: 腾讯
    career_home: https://careers.tencent.com/
    job_search: https://careers.tencent.com/search.html
    keywords: ["产品经理", "后端开发", "算法工程师"]
    application_portal: https://careers.tencent.com/
    feedback_channels: [官网申请状态, 邮件, 电话]

  - name: 字节跳动
    career_home: https://jobs.bytedance.com/
    job_search: https://jobs.bytedance.com/experienced/position
    keywords: ["产品经理", "后端开发", "算法工程师"]
    application_portal: https://jobs.bytedance.com/
    feedback_channels: [官网申请状态, 邮件, 电话]

  - name: 阿里巴巴
    career_home: https://talent.alibaba.com/
