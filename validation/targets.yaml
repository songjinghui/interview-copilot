    # 这里用首页同时作为 job_search 占位，真实接入时需按业务板块分别探测。
    job_search: https://talent.alibaba.com/
    keywords: ["产品经理", "Java开发", "算法工程师"]
    application_portal: https://talent.alibaba.com/
    feedback_channels: [官网申请状态, 邮件, 电话]
    notes: 集团招聘首页可达，但具体职位搜索需进入各业务板块子站点。

  - name: 美团
